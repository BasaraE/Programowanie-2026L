<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieTracker</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>MovieTracker</h1>
</header>

<main>

    <section id="movies">
        <h2>Moje filmy</h2>

        <p>
            Liczba filmów:
            <span id="counter">0</span>
        </p>

        <ul id="movieList" class="cards"></ul>
    </section>

    <section>
        <h2>Dodaj film</h2>

        <form id="movieForm">
            <input
                type="text"
                id="title"
                placeholder="Nazwa filmu">

            <button type="submit">Dodaj</button>
        </form>
    </section>

    <section>
        <h2>Filmy science-fiction</h2>

        <ul class="cards">
            <li>Interstellar</li>
            <li>The Matrix</li>
            <li>Blade Runner 2049</li>
            <li>Dune</li>
        </ul>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
