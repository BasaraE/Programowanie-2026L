<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieTracker</title>
  <link rel="icon" href="./favicon-32x32.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>MovieTracker</h1>
    <p>Prosty projekt do zapisywania filmów</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Moje filmy</h2>
      <p id="movieCount">Liczba filmów: 0</p>
      <ul id="movieList"></ul>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Dodaj film</h2>
      <form id="movieForm">
        <input type="text" id="title" placeholder="Wpisz tytuł filmu" />
        <button type="submit">Dodaj</button>
      </form>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
