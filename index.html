<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poprawa</title>
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/3176/3176363.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>MovieTracker</h1>
    </header>

    <main>
        <section id="movies">
            <h2>Moje filmy</h2>
            <p>Liczba filmów: <span id="movie-counter">0</span></p>
            <ul id="movieList">
            </ul>
        </section>

        <section>
            <h2>Dodaj film</h2>
            <form>
                <input type="text" id="title">
                <button>Dodaj</button>
            </form>
        </section>
        
        <section id="top-10-section">
            <h2>Top 10 Najlepszych Filmów</h2>
            <ol>
                <li>Skazani na Shawshank</li>
                <li>Ojciec chrzestny</li>
                <li>Mroczny Rycerz</li>
                <li>Pulp Fiction</li>
                <li>Incepcja</li>
            </ol>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
