<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poprawa</title>
</head>
<body>
    <header>
        <h1>MovieTracker</h1>
    </header>

    <main>
        <section id="movies">
            <h2>Moje filmy</h2>
            <ul id="movieList">
            </ul>
        </section>

        <section>
            <h2>Dodaj film</h2>
            <form>
                <input type="text" id="title">
                <button>Dodaj</button>
            </form>
        </section>
        <section>
          <h2>Filmy science-fiction</h2>

            <ul class="cards">
             <li>Interstellar</li>
             <li>The Matrix</li>
             <li>Blade Runner 2049</li>
             <li>Dune</li>
            </ul>
        </section>
    </main>
</body>
</html>
