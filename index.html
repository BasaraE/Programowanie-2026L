<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieTracker - Poprawa P_U01</title>
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/3176/3176363.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>MovieTracker</h1>
    </header>

    <main>
        <section id="movies">
            <h2>Moje filmy</h2>
            <p>Liczba filmów: <span id="movie-counter">0</span></p>
            <ul id="movieList">
            </ul>
        </section>

        <section>
            <h2>Dodaj film</h2>
            <form id="movieForm">
                <input type="text" id="title" placeholder="Wpisz tytuł filmu...">
                <button type="submit" id="addButton">Dodaj</button>
            </form>
            <div id="message-container" style="margin-top: 10px; font-weight: bold; color: green;"></div>
        </section>
        
        <section id="recently-added-section">
            <h2>Ostatnio dodane</h2>
            <ul id="recentlyAddedList">
                <li>Brak ostatnio dodanych filmów</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MovieTracker. Autor: Maciej Mita (Album: 73271)</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
